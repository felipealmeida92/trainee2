<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Solicitações</h2>
    <a class="btn btn-primary" routerLink="/requests/new">Nova Solicitação</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Tipo</th> <!-- Adicionado -->
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let request of requests">
        <td>{{ request.id }}</td>
        <td>{{ request.employeeName }}</td>
        <td>{{ request.description }}</td>
        <td>{{ request.type }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="onEdit(request.id)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="onDelete(request.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
